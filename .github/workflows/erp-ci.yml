name: ERP CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: inventory_management_test
          MYSQL_USER: erp_test
          MYSQL_PASSWORD: erp_test_password
          MYSQL_ROOT_PASSWORD: erp_test_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uerp_test -perp_test_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          extensions: mbstring, xml, xmlreader, zip, gd, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate PHP dependency manifest
        run: composer validate --strict --no-check-publish

      - name: Install and build frontend assets
        run: |
          npm ci
          npm run production

      - name: Prepare isolated test environment
        run: |
          cp .env.example .env
          cp .env.testing.example .env.testing
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env.testing
          sed -i 's/^DB_PORT=.*/DB_PORT=3306/' .env.testing
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=inventory_management_test/' .env.testing
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=erp_test/' .env.testing
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=erp_test_password/' .env.testing
          php artisan key:generate --force

      - name: Verify PHP syntax
        run: |
          find app database/migrations routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Verify ERP application artifacts
        run: |
          php artisan view:cache
          php artisan route:list --json > /tmp/erp-routes.json
          test -s /tmp/erp-routes.json
          bash -n bin/erp-deploy
          git diff --check

      - name: Run isolated ERP test suite
        run: bin/test-erp
